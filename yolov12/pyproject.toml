[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clothoid-r-seminar-yolov12-env"
version = "0.1.0"
description = "Environment manifest for the conda 'test' setup used in this YOLOv12 seminar repository."
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "timm==1.0.14",
    "albumentations==2.0.4",
    "onnx==1.14.0",
    "onnxruntime==1.15.1",
    "onnxruntime-gpu==1.18.0",
    "onnxslim==0.1.31",
    "opencv-python==4.9.0.80",
    "pycocotools==2.0.7",
    "PyYAML==6.0.1",
    "scipy==1.13.0",
    "gradio==4.44.1",
    "psutil==5.9.8",
    "py-cpuinfo==9.0.0",
    "huggingface-hub==0.23.2",
    "safetensors==0.4.3",
    "numpy==1.26.4",
    "supervision==0.22.0",
    "ultralytics-thop==2.0.18",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.7",
]

[tool.conda-test]
env_name = "test"
python = "3.10.9"
local_editable_package = "./yolov12"
notes = [
    "This root pyproject documents the core training environment.",
    "For an exact pip snapshot of the conda 'test' environment, use requirements.tst.",
    "The local Ultralytics fork in ./yolov12 is installed editable in the active environment.",
]
