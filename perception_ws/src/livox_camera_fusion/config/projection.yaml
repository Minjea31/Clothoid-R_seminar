# 카메라 내부 파라미터 행렬 K.
# MATLAB 캘리브레이션 결과:
#   FocalLength    = [fx fy]
#   PrincipalPoint = [cx cy]
# 위 값을 camera_matrix에 아래 형태로 입력한다:
#   [fx  0  cx
#    0   fy cy
#    0   0  1]
camera_matrix:
  rows: 3
  cols: 3
  data: [1974.0, 0.0, 963.6,
         0.0, 1971.8, 584.9,
         0.0, 0.0, 1.0]

# LiDAR -> Camera 외부 파라미터 행렬 [R | t].
#   [r11 r12 r13 tx
#    r21 r22 r23 ty
#    r31 r32 r33 tz
#     0   0   0  1]
# extrinsic_matrix에는 위 행렬의 앞 3개 행만 입력한다.
extrinsic_matrix:
  rows: 3
  cols: 4
  data: [0.0026, -1.0, -0.0036, 0.0070,
         0.0108, 0.0036, -0.9999, -0.0679,
         0.9999, 0.0026, 0.0108, 0.1865]
